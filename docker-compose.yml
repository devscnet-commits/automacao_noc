name: automacao_noc

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: noc
      POSTGRES_DB: noc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # Só em 127.0.0.1: porta publicada pelo Docker passa por cima das regras do firewall do host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc -d noc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ainda não há o que rodar: só sobe com --profile app.
  app:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
