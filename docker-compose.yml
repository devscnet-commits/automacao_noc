name: automacao_noc

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: noc
      POSTGRES_DB: noc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # Só em 127.0.0.1: porta publicada pelo Docker passa por cima das regras do firewall do host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc -d noc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ainda não há o que rodar: só sobe com --profile app.
  app:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    # Conexão por partes + senha do mesmo secret do Postgres. Tem prioridade sobre
    # a DATABASE_URL que vem do .env (aquela aponta para 127.0.0.1 e é do dbmate).
    environment:
      NOC_DB_HOST: db
      NOC_DB_PORTA: "5432"
      NOC_DB_USUARIO: noc
      NOC_DB_NOME: noc
      NOC_DB_PASSWORD_FILE: /run/secrets/postgres_password
    # Fora do Swarm o secret é só um bind mount (uid/mode são ignorados): por isso o arquivo
    # no host tem grupo 10001 (o GID do usuário noc da imagem) e modo 640.
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
