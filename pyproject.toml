[project]
name = "automacao-noc"
version = "0.1.0"
description = "Automação da ativação de clientes FTTH: leitura das OLTs, validação da instalação e integração com o MK ERP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "pysnmp>=7.1,<8",
    "pyasn1>=0.6.4",  # já vem com o pysnmp; declarado porque app/olt/snmp.py o importa
    "netmiko>=4.4,<5",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle (avisos)
    "F",     # pyflakes
    "I",     # ordem dos imports
    "UP",    # sintaxe moderna
    "B",     # bugbear
    "S",     # bandit (segurança)
    "ASYNC", # armadilhas de asyncio
    "G",     # logging sem f-string/format (evita interpolar dados sensíveis sem querer)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
